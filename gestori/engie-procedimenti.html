<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGIE - PROCEDIMENTI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:40px;
}

.logo{
position:absolute;
top:30px;
right:40px;
display:flex;
align-items:center;
gap:15px;
}

.logo img{
height:70px;
}

.logo-text{
font-size:18px;
font-weight:bold;
line-height:1.3;
}

.back{
display:inline-block;
margin-bottom:30px;
text-decoration:none;
color:black;
font-weight:bold;
}

h1{
font-size:72px;
font-weight:900;
margin-bottom:20px;
}

.line{
width:500px;
height:6px;
background:linear-gradient(
90deg,
#ff0055,
#ff9900
);
border-radius:50px;
box-shadow:0 4px 10px rgba(255,120,0,.25);
margin-bottom:40px;
}

.pdf-box{
background:white;
border-radius:35px;
height:250px;
display:flex;
justify-content:center;
align-items:center;
font-size:24px;
color:#999;
box-shadow:0 10px 30px rgba(0,0,0,.05);
}

@media(max-width:768px){

body{
padding:20px;
}

.logo{
position:static;
justify-content:flex-end;
margin-bottom:30px;
}

h1{
font-size:48px;
}

.line{
width:100%;
}

}

</style>
</head>
<body>

<a href="engie.html" class="back">
← Torna a ENGIE
</a>

<div class="logo">
<img src="../logo.png">
<div class="logo-text">
TOP HOUSE<br>
casa, energia, fiducia.
</div>
</div>

<h1>PROCEDIMENTI</h1>

<div class="line"></div>

<div class="pdf-box">
Nessun PDF caricato
</div>

</body>
</html>
