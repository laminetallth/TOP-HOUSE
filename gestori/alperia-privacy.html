
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ALPERIA - PRIVACY | TOP HOUSE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:40px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:flex-start;
margin-bottom:30px;
}

.back-btn{
text-decoration:none;
font-size:20px;
font-weight:700;
color:#111;
transition:.3s;
}

.back-btn:hover{
color:#ff6a00;
}

.logo-area{
display:flex;
align-items:center;
gap:15px;
}

.logo-area img{
width:90px;
height:auto;
}

.logo-text h2{
font-size:34px;
font-weight:900;
color:#ff6600;
}

.logo-text p{
font-size:18px;
font-weight:700;
color:#222;
}

.page-title{
font-size:60px;
font-weight:900;
line-height:1;
margin-bottom:12px;
}

.title-line{
width:500px;
max-width:100%;
height:6px;
background:linear-gradient(90deg,#ff0055,#ff9900);
border-radius:50px;
box-shadow:0 4px 10px rgba(255,120,0,.25);
margin-bottom:35px;
}

.pdf-container{
background:white;
border-radius:35px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.empty{
padding:90px;
text-align:center;
font-size:22px;
color:#999;
}

@media(max-width:900px){

.top-bar{
flex-direction:column;
gap:25px;
}

.logo-area{
align-self:flex-start;
}

.page-title{
font-size:42px;
}

.title-line{
width:250px;
}

}

</style>
</head>

<body>

<div class="top-bar">

<a href="alperia.html" class="back-btn">
<i class="fa-solid fa-arrow-left"></i>
 Torna a ALPERIA
</a>

<div class="logo-area">

<img src="../logo.png" alt="TOP HOUSE">

<div class="logo-text">
<h2>TOP HOUSE</h2>
<p>casa, energia, fiducia.</p>
</div>

</div>

</div>

<h1 class="page-title">PRIVACY</h1>

<div class="title-line"></div>

<div class="pdf-container">

<div class="empty">
Nessun PDF caricato
</div>

</div>

</body>
</html>
