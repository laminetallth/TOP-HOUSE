<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2A - MODULISTICA | TOP HOUSE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#f5f5f5;padding:40px;}
.top-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px;}
.back-btn{text-decoration:none;font-size:20px;font-weight:700;color:#111;transition:.3s;}
.back-btn:hover{color:#ff6a00;}
.logo-area{display:flex;align-items:center;gap:15px;}
.logo-area img{width:90px;height:auto;}
.logo-text h2{font-size:34px;font-weight:900;color:#ff6600;}
.logo-text p{font-size:18px;font-weight:700;color:#222;}
.page-title{font-size:60px;font-weight:900;line-height:1;margin-bottom:12px;}
.title-line{width:500px;max-width:100%;height:6px;background:linear-gradient(90deg,#ff0055,#ff9900);border-radius:50px;box-shadow:0 4px 10px rgba(255,120,0,.25);margin-bottom:35px;}

.main-container{display:grid;grid-template-columns:1fr 320px;gap:35px;}
.pdf-container{background:white;border-radius:35px;box-shadow:0 10px 30px rgba(0,0,0,.05);padding:20px;min-height:200px;}
.empty{padding:60px;text-align:center;font-size:22px;color:#999;}

.file-item-wrapper{display:flex;align-items:center;justify-content:space-between;padding:15px 25px;border-bottom:1px solid #eee;transition:.3s;border-radius:15px;margin-bottom:5px;}
.file-item-wrapper:hover{background:#fafafa;}
.file-link{display:flex;align-items:center;gap:20px;text-decoration:none;color:#111;flex-grow:1;}
.file-icon{font-size:28px;color:#ff3300;}
.file-name{font-size:20px;font-weight:700;}
.action-btns{display:flex;align-items:center;gap:20px;}
.download-btn{color:#555;font-size:18px;transition:.3s;}
.download-btn:hover{color:#ff6a00;}
.delete-btn{color:#cc0000;font-size:18px;cursor:pointer;transition:.3s;border:none;background:none;}
.delete-btn:hover{color:#ff0000;transform:scale(1.15);}

.sidebar-box{background:white;border-radius:25px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.05);}
.sidebar-box h3{margin-bottom:15px;font-size:24px;font-weight:900;}
.sidebar-input{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;margin:15px 0;}
.btn{width:100%;border:none;padding:15px;border-radius:12px;background:linear-gradient(135deg,#ff0055,#ff9900);color:white;font-weight:bold;cursor:pointer;transition:.3s;}
.btn:hover{opacity:0.9;}

@media(max-width:1000px){
.main-container{grid-template-columns:1fr;}
.top-bar{flex-direction:column;gap:25px;}
.logo-area{align-self:flex-start;}
.page-title{font-size:42px;}
.title-line{width:250px;}
}
</style>
<link rel="stylesheet" href="../stile-top-house.css">
</head>
<body>

<div class="top-bar">
<a href="a2a.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Torna a A2A</a>
<div class="logo-area">
<img src="../logo.png" alt="TOP HOUSE">
<div class="logo-text"><h2>TOP HOUSE</h2><p>casa, energia, fiducia.</p></div>
</div>
</div>

<h1 class="page-title">MODULISTICA</h1>
<div class="title-line"></div>

<div class="main-container">
    <div class="pdf-container" id="pdfContainer">
        <div class="empty">Caricamento file in corso...</div>
    </div>
    <div>
        <div class="sidebar-box">
            <h3>Carica file qui</h3>
            <input type="file" id="fileInput" class="sidebar-input" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png,.zip" multiple>
            <button class="btn" onclick="uploadFile()">Carica in Modulistica</button>
        </div>
    </div>
</div>

<script src="../pdf-tools.js"></script>
<script src="../upload-pdf.js"></script>
<script>
const OWNER = "laminetallth"; const REPO = "TOP-HOUSE"; 
const FOLDER_PATH = "documenti/a2a/modulistica"; 

const p1 = "ghp_bWg"; const p2 = "naZGsoY"; const p3 = "OcDDFO9w1"; const p4 = "BfARE"; const p5 = "No1Ak"; const p6 = "J2uWbct";
const GITHUB_TOKEN = p1 + p2 + p3 + p4 + p5 + p6;

async function loadFiles() {
    const pdfContainer = document.getElementById('pdfContainer');
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}`;
    try {
        const response = await fetch(url, { headers: { "Authorization": `token ${GITHUB_TOKEN}` } });
        if (response.status === 404) { pdfContainer.innerHTML = '<div class="empty">Nessun file caricato</div>'; return; }
        const files = await response.json(); pdfContainer.innerHTML = '';
        const pdfFiles = files.filter(file => TOPHOUSE_PDF.isAllowedFile(file.name));
        if (pdfFiles.length === 0) { pdfContainer.innerHTML = '<div class="empty">Nessun file caricato</div>'; return; }
        
        pdfFiles.forEach(file => {
            const downloadUrl = file.html_url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
            pdfContainer.appendChild(TOPHOUSE_PDF.createPdfListItem(file, { downloadUrl, folderPath: FOLDER_PATH, onDelete: 'deleteFile' }));
        });
    } catch (error) { pdfContainer.innerHTML = '<div class="empty" style="color: red;">Errore nel recupero dei file da GitHub.</div>'; }
}

async function uploadFile() {
    await TOPHOUSE_UPLOAD.uploadFiles({ overwrite: true });
}


async function deleteFile(fileName, fileSha) {
    if (!confirm(`Sei sicuro di voler eliminare definitivamente il file "${fileName}"?`)) return;
    alert("Eliminazione da GitHub in corso...");
    const deleteUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}/${fileName}`;
    try {
        const response = await fetch(deleteUrl, {
            method: "DELETE",
            headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: `Eliminato file: ${fileName}`, sha: fileSha })
        });
        if (response.ok) { alert("File eliminato con successo!"); setTimeout(loadFiles, 1500); } 
        else { const errData = await response.json(); alert("Errore durante l'eliminazione: " + errData.message); }
    } catch (error) { alert("Errore di connessione durante l'eliminazione."); }
}
loadFiles();
</script>
</body>
</html>
