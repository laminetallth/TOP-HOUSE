<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUDAX - CTE RESIDENZIALE | TOP HOUSE</title>
<link rel="stylesheet" href="../stile-top-house.css">
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#f5f5f5;padding:40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:35px}
.back{text-decoration:none;color:#111;font-size:20px;font-weight:700}.back:hover{color:#ff6a00}
.brand{display:flex;align-items:center;gap:14px}.brand img{width:90px}.brand h2{margin:0;color:#ff6600;font-size:32px;font-weight:900}.brand p{margin:3px 0;font-weight:700}
.title{font-size:64px;font-weight:900;margin:0 0 12px}.line{width:500px;max-width:100%;height:6px;background:linear-gradient(90deg,#ff0055,#ff9900);border-radius:50px;box-shadow:0 4px 10px rgba(255,120,0,.25);margin-bottom:35px}
.main{display:grid;grid-template-columns:1fr 320px;gap:35px}.pdf-container{background:#fff;border-radius:35px;box-shadow:0 10px 30px rgba(0,0,0,.05);padding:20px;min-height:200px}.empty{padding:60px;text-align:center;font-size:22px;color:#999}
.sidebar-box{background:#fff;border-radius:25px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.05)}.sidebar-box h3{margin:0 0 15px;font-size:24px;font-weight:900}.sidebar-input{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;margin:15px 0}.btn{width:100%;border:0;padding:15px;border-radius:12px;background:linear-gradient(135deg,#ff0055,#ff9900);color:#fff;font-weight:bold;cursor:pointer}.btn:hover{opacity:.9}
@media(max-width:1000px){.main{grid-template-columns:1fr}.top{flex-direction:column;gap:25px}.brand{align-self:flex-start}.title{font-size:48px}}
</style>
<script src="../utenti-ruoli.js"></script>
<script type="module" src="../auth-guard.js"></script>
</head>
<body>
<div class="top"><a class="back" href="audax-cte.html">← Torna a CTE AUDAX</a><div class="brand"><img src="../logo.png" alt="TOP HOUSE"><div><h2>TOP HOUSE</h2><p>casa, energia, fiducia.</p></div></div></div>
<h1 class="title">RESIDENZIALE</h1><div class="line"></div>
<div class="main"><div class="pdf-container" id="pdfContainer"><div class="empty">Caricamento file in corso...</div></div><div><div class="sidebar-box"><h3>Carica file qui</h3><input type="file" id="fileInput" class="sidebar-input" multiple><button class="btn" onclick="uploadFile()">Carica in Residenziale</button></div></div></div>
<script src="../pdf-tools.js"></script><script src="../upload-pdf.js"></script>
<script>
const OWNER="laminetallth",REPO="TOP-HOUSE",FOLDER_PATH="documenti/audax/cte/residenziale";
async function loadFiles(){const c=document.getElementById('pdfContainer');try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}`,{headers:{"Authorization":`token ${GITHUB_TOKEN}`}});if(r.status===404){c.innerHTML='<div class="empty">Nessun file caricato</div>';return}const files=await r.json();c.innerHTML='';const display=files.filter(f=>TOPHOUSE_PDF.isDisplayableFile(f));if(!display.length){c.innerHTML='<div class="empty">Nessun file caricato</div>';return}display.forEach(file=>{const downloadUrl=file.html_url.replace('github.com','raw.githubusercontent.com').replace('/blob/','/');c.appendChild(TOPHOUSE_PDF.createPdfListItem(file,{downloadUrl,folderPath:FOLDER_PATH,onDelete:'deleteFile'}))})}catch(e){c.innerHTML='<div class="empty" style="color:red">Errore nel recupero dei file da GitHub.</div>'}}
async function uploadFile(){await TOPHOUSE_UPLOAD.uploadFiles({overwrite:true})}
async function deleteFile(fileName,fileSha){if(!confirm(`Sei sicuro di voler eliminare definitivamente il file "${fileName}"?`))return;const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}/${fileName}`,{method:'DELETE',headers:{"Authorization":`token ${GITHUB_TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify({message:`Eliminato file: ${fileName}`,sha:fileSha})});if(r.ok){alert('File eliminato con successo!');setTimeout(loadFiles,800)}else alert('Errore durante l’eliminazione.')}loadFiles();
</script>
</body></html>
