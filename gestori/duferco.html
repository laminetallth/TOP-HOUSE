<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUFERCO - TOP HOUSE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#f5f5f5; padding:40px; }
.top-bar{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:30px; }
.logo-area{ display:flex; align-items:center; gap:15px; }
.logo-area img{ width:70px; height:auto; }
.logo-text h2{ font-size:28px; font-weight:900; color:#ff5a00; margin:0; }
.logo-text p{ margin:0; font-size:15px; font-weight:700; color:#333; }
.back{ display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:#111; font-weight:700; margin-bottom:20px; font-size:18px; }
.back:hover{ color:#ff5500; }
h1{ font-size:55px; font-weight:900; margin-bottom:30px; }
.list{ background:white; border-radius:30px; overflow:hidden; box-shadow:0 5px 20px rgba(0,0,0,.05); }
.item{ display:flex; justify-content:space-between; align-items:center; padding:30px; border-bottom:1px solid #eee; cursor:pointer; transition:.3s; }
.item:last-child{ border-bottom:none; }
.item:hover{ background:#fafafa; }
.left{ display:flex; align-items:center; gap:20px; }
.icon{ width:55px; height:55px; border-radius:15px; background:linear-gradient(135deg,#ff0055,#ff9900); display:flex; justify-content:center; align-items:center; color:white; font-size:24px; }
.name{ font-size:24px; font-weight:800; }
.arrow{ font-size:24px; }
@media(max-width:768px){ .top-bar{ flex-direction:column; gap:20px; } .logo-area{ align-self:flex-start; } h1{ font-size:42px; } }
</style>
<link rel="stylesheet" href="../stile-top-house.css">
</head>
<body>

<div class="top-bar">
    <div>
        <a href="../luce-gas.html" class="back">
            <i class="fa-solid fa-arrow-left"></i> Torna ai gestori
        </a>
        <h1>DUFERCO</h1>
    </div>
    <div class="logo-area">
        <img src="../logo.png" alt="TOP HOUSE">
        <div class="logo-text">
            <h2>TOP HOUSE</h2>
            <p>casa, energia, fiducia.</p>
        </div>
    </div>
</div>

<div class="list">
    <div class="item" onclick="location.href='duferco-cte.html'">
        <div class="left">
            <div class="icon"><i class="fa-solid fa-folder"></i></div>
            <div class="name">CTE</div>
        </div>
        <div class="arrow"><i class="fa-solid fa-angle-right"></i></div>
    </div>

    <div class="item" onclick="location.href='duferco-modulistica.html'">
        <div class="left">
            <div class="icon"><i class="fa-solid fa-file-lines"></i></div>
            <div class="name">MODULISTICA</div>
        </div>
        <div class="arrow"><i class="fa-solid fa-angle-right"></i></div>
    </div>

    <div class="item" onclick="location.href='duferco-procedimenti.html'">
        <div class="left">
            <div class="icon"><i class="fa-solid fa-gears"></i></div>
            <div class="name">PROCEDIMENTI</div>
        </div>
        <div class="arrow"><i class="fa-solid fa-angle-right"></i></div>
    </div>

    <div class="item" onclick="location.href='duferco-privacy.html'">
        <div class="left">
            <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
            <div class="name">PRIVACY</div>
        </div>
        <div class="arrow"><i class="fa-solid fa-angle-right"></i></div>
    </div>
</div>

</body>
</html>
