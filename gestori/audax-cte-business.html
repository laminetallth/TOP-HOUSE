<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUDAX - CTE BUSINESS | TOP HOUSE</title><link rel="stylesheet" href="../stile-top-house.css"><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#f5f5f5;padding:40px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:35px}.back{text-decoration:none;color:#111;font-size:20px;font-weight:700}.brand{display:flex;align-items:center;gap:14px}.brand img{width:90px}.brand h2{margin:0;color:#ff6600;font-size:32px;font-weight:900}.brand p{margin:3px 0;font-weight:700}.title{font-size:60px;font-weight:900;margin:0 0 12px}.line{width:500px;max-width:100%;height:6px;background:linear-gradient(90deg,#ff0055,#ff9900);border-radius:50px;margin-bottom:35px}.main{display:grid;grid-template-columns:1fr 320px;gap:35px}.files,.upload{background:#fff;border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.05)}.files{padding:20px;min-height:220px}.empty{padding:60px;text-align:center;color:#999;font-size:22px}.upload{padding:30px}.upload h3{font-size:24px;margin:0 0 15px}.input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:10px 0 15px}.btn{width:100%;border:0;padding:15px;border-radius:12px;background:linear-gradient(135deg,#ff0055,#ff9900);color:#fff;font-weight:800;cursor:pointer}.item{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid #eee;text-decoration:none;color:#111;font-weight:700}.item:last-child{border:0}@media(max-width:900px){body{padding:20px}.main{grid-template-columns:1fr}.top{flex-direction:column;gap:25px}.title{font-size:44px}}</style><script src="../utenti-ruoli.js"></script><script type="module" src="../auth-guard.js"></script></head><body><div class="top"><a class="back" href="audax-cte.html">← Torna a CTE AUDAX</a><div class="brand"><img src="../logo.png" alt="TOP HOUSE"><div><h2>TOP HOUSE</h2><p>casa, energia, fiducia.</p></div></div></div><h1 class="title">BUSINESS</h1><div class="line"></div><div class="main"><div class="files" id="pdfContainer"><div class="empty">Caricamento file in corso...</div></div><div class="upload"><h3>Carica file qui</h3><input class="input" type="file" id="fileInput" multiple><button class="btn" onclick="uploadFile()">Carica in Business</button></div></div><script src="../pdf-tools.js"></script><script src="../upload-pdf.js"></script><script>const OWNER="laminetallth",REPO="TOP-HOUSE",FOLDER_PATH="documenti/audax/cte/business";const p1="ghp_bWg",p2="naZGsoY",p3="OcDDFO9w1",p4="BfARE",p5="No1Ak",p6="J2uWbct";const GITHUB_TOKEN=p1+p2+p3+p4+p5+p6;async function loadFiles(){const c=document.getElementById('pdfContainer');try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}`,{headers:{Authorization:`token ${GITHUB_TOKEN}`}});if(r.status===404){c.innerHTML='<div class="empty">Nessun file caricato</div>';return}const fs=await r.json();c.innerHTML='';const ds=fs.filter(f=>TOPHOUSE_PDF.isDisplayableFile(f));if(!ds.length){c.innerHTML='<div class="empty">Nessun file caricato</div>';return}ds.forEach(f=>{const u=f.html_url.replace('github.com','raw.githubusercontent.com').replace('/blob/','/');c.appendChild(TOPHOUSE_PDF.createPdfListItem(f,{downloadUrl:u,folderPath:FOLDER_PATH,onDelete:'deleteFile'}))})}catch(e){c.innerHTML='<div class="empty" style="color:red">Errore nel recupero dei file.</div>'}}async function uploadFile(){await TOPHOUSE_UPLOAD.uploadFiles({overwrite:true})}async function deleteFile(n,s){if(!confirm(`Sei sicuro di voler eliminare definitivamente il file "${n}"?`))return;const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}/${n}`,{method:'DELETE',headers:{Authorization:`token ${GITHUB_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({message:`Eliminato file: ${n}`,sha:s})});if(r.ok)setTimeout(loadFiles,800);else alert('Errore durante l’eliminazione.')}loadFiles();</script></body></html>
