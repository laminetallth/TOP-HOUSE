<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:40px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:flex-start;
margin-bottom:30px;
}

.back-btn{
text-decoration:none;
font-size:20px;
font-weight:700;
color:#111;
transition:.3s;
}

.back-btn:hover{
color:#ff6a00;
}

.logo-area{
display:flex;
align-items:center;
gap:15px;
}

.logo-area img{
width:90px;
height:auto;
}

.logo-text h2{
font-size:34px;
font-weight:900;
color:#ff6600;
}

.logo-text p{
font-size:18px;
font-weight:700;
color:#222;
}

.page-title{
font-size:60px;
font-weight:900;
line-height:1;
margin-bottom:12px;
}

.title-line{
width:500px;
max-width:100%;
height:6px;
background:linear-gradient(90deg,#ff0055,#ff9900);
border-radius:50px;
box-shadow:0 4px 10px rgba(255,120,0,.25);
margin-bottom:35px;
}

.folder-container{
background:white;
border-radius:35px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.folder{
display:flex;
justify-content:space-between;
align-items:center;
padding:30px;
border-bottom:1px solid #eee;
text-decoration:none;
color:#111;
transition:.25s;
}

.folder:last-child{
border-bottom:none;
}

.folder:hover{
background:#fafafa;
transform:translateY(-2px);
}

.left{
display:flex;
align-items:center;
gap:20px;
}

.icon{
width:60px;
height:60px;
border-radius:18px;
background:linear-gradient(135deg,#ff0055,#ff9900);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:24px;
}

.name{
font-size:22px;
font-weight:700;
}

.arrow{
font-size:26px;
}

@media(max-width:900px){

.top-bar{
flex-direction:column;
gap:25px;
}

.logo-area{
align-self:flex-start;
}

.page-title{
font-size:42px;
}

.title-line{
width:250px;
}

}

</style>
<link rel="stylesheet" href="../stile-top-house.css">
