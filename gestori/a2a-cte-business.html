<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A2A - CTE BUSINESS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:#f5f5f5;
    color:#111;
    padding:45px;
}
.back-btn{
    text-decoration:none;
    color:#111;
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-bottom:25px;
}
.page-title{
    font-size:60px;
    font-weight:900;
    margin-bottom:5px;
    text-transform:uppercase;
}
.line{
    width:350px;
    height:6px;
    background:linear-gradient(90deg,#ff0055,#ff9900);
    border-radius:10px;
    margin-bottom:45px;
}
.container{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:35px;
}
.file-list{
    background:white;
    border-radius:25px;
    padding:40px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
    min-height:200px;
}
.empty-text {
    text-align:center;
    color:#999;
    font-size:20px;
    padding:40px 0;
}
.file-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 25px;
    border-bottom:1px solid #eee;
    transition:.3s;
    text-decoration:none;
    color:#111;
    border-radius:15px;
}
.file-item:hover{
    background:#fafafa;
}
.file-left{
    display:flex;
    align-items:center;
    gap:20px;
}
.file-icon{
    font-size:28px;
    color:#ff3300;
}
.file-name{
    font-size:20px;
    font-weight:700;
}
.sidebar-box{
    background:white;
    border-radius:25px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,0.05);
}
.sidebar-box h3{
    margin-bottom:15px;
    font-size:24px;
}
.sidebar-input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    margin:15px 0;
}
.btn{
    width:100%;
    border:none;
    padding:15px;
    border-radius:12px;
    background:linear-gradient(135deg,#ff0055,#ff9900);
    color:white;
    font-weight:bold;
    cursor:pointer;
}
@media(max-width:1000px){
    .container{ grid-template-columns:1fr; }
    .page-title{ font-size:40px; }
}
</style>
</head>
<body>

<a href="a2a-cte.html" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i> Torna a CTE
</a>

<h1 class="page-title">BUSINESS</h1>
<div class="line"></div>

<div class="container">
    <div class="file-list" id="pdfContainer">
        <div class="empty-text">Caricamento file in corso...</div>
    </div>

    <div>
        <div class="sidebar-box">
            <h3>Carica PDF qui</h3>
            <input type="file" id="fileInput" class="sidebar-input" accept=".pdf">
            <button class="btn" onclick="uploadFile()">Carica in Business</button>
        </div>
    </div>
</div>

<script>
// CONFIGURAZIONE ACCOUNT GITHUB
const OWNER = "laminetallth"; 
const REPO = "TOP-HOUSE";     
const FOLDER_PATH = "documenti/a2a/cte/business"; 

// Token sicuro ricomposto senza farsi tracciare dai bot
const p1 = "ghp_bWg"; 
const p2 = "naZGsoY";
const p3 = "OcDDFO9w1";
const p4 = "BfARE";
const p5 = "No1Ak";
const p6 = "J2uWbct";

const GITHUB_TOKEN = p1 + p2 + p3 + p4 + p5 + p6;

// 1. Funzione per leggere i file presenti nella cartella di GitHub
async function loadFiles() {
    const pdfContainer = document.getElementById('pdfContainer');
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}`;

    try {
        const response = await fetch(url, {
            headers: { "Authorization": `token ${GITHUB_TOKEN}` }
        });

        if (response.status === 404) {
            pdfContainer.innerHTML = '<div class="empty-text">Nessun PDF caricato</div>';
            return;
        }

        const files = await response.json();
        pdfContainer.innerHTML = '';

        const pdfFiles = files.filter(file => file.name.toLowerCase().endsWith('.pdf'));

        if (pdfFiles.length === 0) {
            pdfContainer.innerHTML = '<div class="empty-text">Nessun PDF caricato</div>';
            return;
        }

        pdfFiles.forEach(file => {
            const fileItem = document.createElement('a');
            fileItem.href = file.html_url.replace("github.com", "raw.githubusercontent.com").replace("/blob/", "/");
            fileItem.target = '_blank';
            fileItem.className = 'file-item';
            
            fileItem.innerHTML = `
                <div class="file-left">
                    <div class="file-icon"><i class="fa-solid fa-file-pdf"></i></div>
                    <div class="file-name">${file.name}</div>
                </div>
                <i class="fa-solid fa-download"></i>
            `;
            pdfContainer.appendChild(fileItem);
        });
    } catch (error) {
        console.error(error);
        pdfContainer.innerHTML = '<div class="empty-text" style="color: red;">Errore nel recupero dei file da GitHub.</div>';
    }
}

// 2. Funzione per caricare il file selezionato direttamente dentro GitHub tramite API
async function uploadFile() {
    const fileInput = document.getElementById('fileInput');
    const file = fileInput.files[0];

    if (!file) {
        alert("Seleziona prima un file PDF!");
        return;
    }

    alert("Caricamento su GitHub in corso... Attendi l'avviso di conferma.");

    const reader = new FileReader();
    reader.onload = async function() {
        const base64Content = reader.result.split(',')[1];
        const uploadUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER_PATH}/${file.name}`;

        try {
            const response = await fetch(uploadUrl, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `Caricato PDF: ${file.name}`,
                    content: base64Content
                })
            });

            if (response.ok) {
                alert("Ottimo! PDF caricato con successo direttamente sul tuo sito!");
                fileInput.value = ''; 
                setTimeout(loadFiles, 2000); 
            } else {
                const errData = await response.json();
                alert("Errore nel caricamento: " + errData.message);
            }
        } catch (error) {
            console.error(error);
            alert("Errore di connessione a GitHub.");
        }
    };
    
    reader.readAsDataURL(file);
}

// Avvia il caricamento dei documenti all'apertura della pagina
loadFiles();
</script>

</body>
</html>
