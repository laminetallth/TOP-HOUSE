<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Venditori | TOP HOUSE</title>
<link rel="stylesheet" href="stile-top-house.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff 0%,#f7f7f7 45%,#111 45%,#111 100%);font-family:Arial,sans-serif;color:#111}.login-card{width:min(440px,calc(100% - 32px));background:#fff;border-radius:32px;padding:38px;box-shadow:0 30px 90px rgba(0,0,0,.18);border-top:8px solid #ff6a00}.brand{text-align:center;margin-bottom:28px}.brand img{width:96px}.brand h1{margin:10px 0 0;font-size:40px;font-weight:900;background:linear-gradient(90deg,#ff0055,#ff9900);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.brand p{margin:6px 0 0;font-weight:800}.field{display:grid;gap:8px;margin-bottom:18px}.field label{font-weight:800}.field input{border:1px solid #ddd;border-radius:16px;padding:15px 16px;font-size:16px}.login-btn{width:100%;border:0;border-radius:18px;padding:16px;background:linear-gradient(135deg,#ff0055,#ff9900);color:white;font-size:17px;font-weight:900;cursor:pointer}.error{min-height:22px;color:#c40000;font-weight:800;margin:14px 0;text-align:center}.note{font-size:13px;color:#666;text-align:center;margin-top:18px}
</style>
</head>
<body>
<main class="login-card">
  <div class="brand">
    <img src="logo.png" alt="TOP HOUSE">
    <h1>TOP HOUSE</h1>
    <p>Accesso portale venditori</p>
  </div>
  <form id="loginForm" autocomplete="on">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <div id="loginError" class="error" role="alert"></div>
    <button class="login-btn" type="submit">Accedi</button>
  </form>
  <p class="note">Le password sono gestite da Firebase Authentication e non sono salvate nel sito.</p>
</main>
<script type="module" src="auth.js"></script>
</body>
</html>
