<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invita venditori | TOP HOUSE</title>
<link rel="stylesheet" href="stile-top-house.css">
<style>
body{margin:0;min-height:100vh;background:#f5f5f5;font-family:Arial,sans-serif;color:#111}.invite-wrap{max-width:760px;margin:0 auto;padding:48px 20px}.invite-card{background:#fff;border-radius:32px;padding:38px;box-shadow:0 25px 70px rgba(0,0,0,.10);border-top:8px solid #ff6a00}.brand{display:flex;align-items:center;gap:16px;margin-bottom:28px}.brand img{width:76px}.brand h1{margin:0;font-size:36px;font-weight:900;background:linear-gradient(90deg,#ff0055,#ff9900);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.brand p{margin:4px 0 0;font-weight:800}.field{display:grid;gap:8px;margin:22px 0}.field label{font-weight:900}.field input{border:1px solid #ddd;border-radius:16px;padding:15px 16px;font-size:16px}.invite-btn{border:0;border-radius:18px;padding:16px 22px;background:linear-gradient(135deg,#ff0055,#ff9900);color:#fff;font-weight:900;cursor:pointer}.back{display:inline-block;margin-bottom:18px;color:#111;text-decoration:none;font-weight:900}.status{margin-top:18px;font-weight:800;color:#333}.help{color:#555;line-height:1.5}
</style>
</head>
<body>
<main class="invite-wrap">
  <a class="back" href="index.html">← Torna al portale</a>
  <section class="invite-card" data-admin-only>
    <div class="brand">
      <img src="logo.png" alt="TOP HOUSE">
      <div><h1>Invita venditori</h1><p>Gestione accessi TOP HOUSE</p></div>
    </div>
    <p class="help">Inserisci l’email del venditore. Firebase creerà l’accesso con password temporanea casuale non mostrata e invierà al venditore il link per scegliere o reimpostare la propria password.</p>
    <form id="sellerInviteForm">
      <div class="field">
        <label for="sellerEmail">Email venditore</label>
        <input id="sellerEmail" name="email" type="email" required autocomplete="email" placeholder="venditore@esempio.it">
      </div>
      <button class="invite-btn" type="submit">Invia invito password</button>
    </form>
    <div id="inviteStatus" class="status" role="status"></div>
  </section>
</main>
<script type="module" src="auth.js"></script>
</body>
</html>
