<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100d21"><title>Anime Battle Arena</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#35205c,#100d21 70%);color:#fff;font:16px system-ui;min-height:100vh}main{max-width:860px;margin:auto;padding:20px}h1{text-align:center;font-size:clamp(32px,8vw,64px);background:linear-gradient(100deg,#ffae54,#f74c83,#b18aff);background-clip:text;color:transparent;margin:24px 0 8px;animation:appear 1.1s both}header{text-align:center;color:#c7b9e8}button,select{background:#34234e;color:white;border:1px solid #8562b1;border-radius:14px;padding:13px;cursor:pointer;font:inherit}button:hover:not(:disabled){background:#60408e;transform:translateY(-2px)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:linear-gradient(110deg,#f17835,#d13e85);border:0;font-weight:800}.panel{background:#201733dd;border:1px solid #594276;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 15px 40px #0004}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{padding:16px;border-radius:15px;background:#302145;text-align:center}.coins{font-size:27px;color:#ffd57c;font-weight:800}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.card{background:linear-gradient(145deg,#3c2b64,#1e1635);border:2px solid #72559a;border-radius:18px;min-height:180px;padding:16px 9px;text-align:center;animation:flip .65s both;box-shadow:0 12px 24px #0005}.card b{display:block;font-size:20px;margin:18px 0 8px}.card small{color:#d6c5f0}.card.chosen{border-color:#ffad4c;box-shadow:0 0 25px #ff9e5366}.status{text-align:center;font-size:20px;font-weight:700;margin:18px 0}.log{max-height:170px;overflow:auto;color:#d8c7eb;font-size:13px}.hidden{display:none!important}.tag{display:inline-block;background:#4c315c;border-radius:20px;padding:6px 12px;font-size:12px}.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{background:#302145;border-radius:12px;padding:12px;min-height:80px}.team p{margin:7px 0}.hero{text-align:center;font-size:58px;animation:glow 2s infinite alternate}.win{color:#ffc675;font-size:32px;text-align:center}#intro{position:fixed;inset:0;z-index:10;background:radial-gradient(circle,#5c277d,#0d0919 70%);display:grid;place-items:center;text-align:center;animation:intro 2.7s forwards;pointer-events:none}#intro strong{font-size:clamp(34px,8vw,72px);color:#ffb769;text-shadow:0 0 35px #e97c78}@keyframes intro{0%,75%{opacity:1}100%{opacity:0;visibility:hidden}}@keyframes appear{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:none}}@keyframes flip{from{opacity:0;transform:rotateY(85deg) scale(.85)}to{opacity:1;transform:none}}@keyframes glow{to{filter:drop-shadow(0 0 30px #e38dff)}}@media(max-width:520px){.cards{gap:6px}.card{padding:12px 4px;min-height:150px}.card b{font-size:15px}.panel{padding:14px}button{padding:11px}.players{gap:6px}}
</style><style id="arena-fx">
:root{--gold:#ffc16c;--violet:#ad72ff}
body{overflow-x:hidden;background:radial-gradient(circle at 20% 20%,#40205e 0,transparent 35%),radial-gradient(circle at 80% 75%,#243a68 0,transparent 40%),#0a0919;background-size:130% 130%;animation:skyShift 12s ease-in-out infinite alternate}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(115deg,transparent 0 45px,#ffffff04 46px 47px);animation:gridMove 20s linear infinite}
main{position:relative;z-index:1}header{letter-spacing:.35em;animation:letterGlow 3s ease-in-out infinite alternate}h1{filter:drop-shadow(0 0 12px #b84caa66);animation:appear 1.1s both,titlePulse 4s ease-in-out 1.1s infinite}.hero{animation:heroFloat 3s ease-in-out infinite;filter:drop-shadow(0 0 16px #ba69ff)}
.panel{backdrop-filter:blur(16px);animation:panelRise .65s cubic-bezier(.2,.8,.2,1) both;transition:box-shadow .3s,border-color .3s}.panel:hover{border-color:#a46adb;box-shadow:0 20px 55px #7020ab33}
button{transition:transform .2s,box-shadow .2s,background .2s;position:relative;overflow:hidden}button:not(:disabled):active{transform:scale(.93)}button:not(:disabled):hover{box-shadow:0 0 22px #e55ca066}button:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff33 50%,transparent 70%);transform:translateX(-150%);transition:transform .55s}button:hover:after{transform:translateX(150%)}
.player{position:relative;overflow:hidden;animation:panelRise .8s both}.player:after{content:"";position:absolute;inset:-100%;background:conic-gradient(transparent,#e5aaff17,transparent);animation:spin 8s linear infinite;pointer-events:none}.coins{animation:coinGlow 2.3s ease-in-out infinite alternate}.card{position:relative;transform-style:preserve-3d;transition:transform .35s,box-shadow .35s,border-color .35s;animation:cardEntrance .75s cubic-bezier(.2,.8,.2,1) both}.card:hover{transform:translateY(-9px) rotateX(4deg);box-shadow:0 18px 40px #ad69ff55}.card:before{content:"✦";position:absolute;right:10px;top:8px;color:#f8d0ff88;animation:twinkle 2s ease-in-out infinite alternate}.card.chosen{animation:cardEntrance .75s both,chosenGlow 1.5s infinite alternate}.status{animation:letterGlow 2.5s infinite alternate}.win{animation:winnerReveal .9s cubic-bezier(.1,.9,.2,1) both,coinGlow 2s infinite alternate}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}.spark{position:absolute;bottom:-20px;width:3px;height:3px;background:#f3a9ff;border-radius:50%;box-shadow:0 0 10px #ffb0fa;animation:sparkRise var(--duration) linear infinite;animation-delay:var(--delay);left:var(--left)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0;background:radial-gradient(circle,#ffd8ff80,transparent 70%)}#flash.go{animation:flash .65s ease-out}
#toast{position:fixed;top:18%;left:50%;transform:translate(-50%,-20%) scale(.5);z-index:25;pointer-events:none;opacity:0;font-size:clamp(22px,5vw,48px);font-weight:1000;color:#ffd58d;text-shadow:0 0 30px #ff6f96;text-align:center}#toast.show{animation:toastPop 1.25s both}
#intro{animation:intro 3.1s forwards}#intro strong{animation:introText 2.5s ease-in-out both}
@keyframes skyShift{to{background-position:100% 100%}}@keyframes gridMove{to{transform:translateX(100px)}}@keyframes titlePulse{50%{filter:drop-shadow(0 0 28px #ff8ba4)}}@keyframes heroFloat{50%{transform:translateY(-13px) rotate(-5deg) scale(1.08)}}@keyframes letterGlow{to{text-shadow:0 0 20px #c778ff}}@keyframes panelRise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}@keyframes coinGlow{to{text-shadow:0 0 25px #ffc66e}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cardEntrance{from{opacity:0;transform:perspective(700px) rotateY(110deg) translateY(40px) scale(.7)}to{opacity:1;transform:perspective(700px) rotateY(0) translateY(0) scale(1)}}@keyframes chosenGlow{to{box-shadow:0 0 35px #ffae64aa;transform:translateY(-4px)}}@keyframes twinkle{to{opacity:.2;transform:scale(1.6)}}@keyframes winnerReveal{from{opacity:0;transform:scale(.4) rotate(-8deg)}to{opacity:1;transform:scale(1)}}@keyframes sparkRise{to{transform:translateY(-110vh) translateX(60px);opacity:0}}@keyframes flash{20%{opacity:1}100%{opacity:0}}@keyframes toastPop{15%,70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1.15)}}@keyframes introText{0%{opacity:0;transform:scale(.3);filter:blur(20px)}35%,75%{opacity:1;transform:scale(1);filter:blur(0)}100%{transform:scale(1.4);opacity:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><div id="intro"><strong>⚔️ ANIME<br>BATTLE ARENA</strong></div><div id="particles" aria-hidden="true"></div><div id="flash" aria-hidden="true"></div><div id="toast" aria-live="polite"></div><main><header>⚡ LAMINE VS BASSIROU ⚡</header><h1>ANIME BATTLE ARENA</h1><div class="hero">🃏</div><section class="panel" id="setup"><h2>Scegli la modalità</h2><div class="row"><button onclick="start('classic')">⚔️ Asta classica</button><button onclick="start('three')">🃏 Tre carte</button><button onclick="start('multiverse')">🌌 Multiverso</button></div><p style="text-align:center;color:#c6b5e2">20 monete ciascuno · 4 personaggi a testa · primo offerente alternato</p></section><section id="game" class="hidden"><div class="players"><div class="player"><b>LAMINE</b><div class="coins">🪙 <span id="c0">20</span></div></div><div class="player"><b>BASSIROU</b><div class="coins">🪙 <span id="c1">20</span></div></div></div><div class="panel"><div class="row"><span class="tag" id="mode"></span><span class="tag" id="round"></span></div><div class="status" id="status"></div><div class="cards" id="cards"></div><div class="row" id="controls"></div><div class="log" id="log"></div></div><div class="teams"><div class="team"><b>⚔️ LAMINE</b><div id="t0"></div></div><div class="team"><b>⚔️ BASSIROU</b><div id="t1"></div></div></div><div class="row" style="margin:20px"><button onclick="reset()">Nuova partita</button></div></section></main><script>
const roster={Naruto:[['Naruto Uzumaki',98],['Sasuke Uchiha',96],['Madara Uchiha',96],['Hashirama Senju',92],['Kakashi Hatake',89],['Itachi Uchiha',87],['Minato Namikaze',89],['Obito Uchiha',94]],'Black Clover':[['Asta',98],['Yuno',97],['Lucius Zogratis',99],['Julius Novachrono',94],['Mereoleona Vermillion',93],['Yami Sukehiro',92],['Noelle Silva',91],['Lucifero',97]],Bleach:[['Ichigo Kurosaki',99],['Aizen Sosuke',98],['Yhwach',100],['Kenpachi Zaraki',96],['Rukia Kuchiki',88],['Byakuya Kuchiki',91],['Uryu Ishida',94],['Yamamoto',97]],'One Piece':[['Monkey D. Luffy',98],['Roronoa Zoro',94],['Shanks',98],['Kaido',97],['Big Mom',95],['Trafalgar Law',92],['Marshall D. Teach',96],['Dracule Mihawk',96]],'Fairy Tail':[['Natsu Dragneel',97],['Acnologia',99],['Zeref Dragneel',98],['Erza Scarlet',92],['Wendy Marvell',89],['Laxus Dreyar',93],['Gildarts Clive',94],['Ignia',98]],Boruto:[['Boruto Uzumaki',99],['Kawaki',97],['Daemon',99],['Code',93],['Sarada Uchiha',91],['Mitsuki',89],['Momoshiki',96],['Jura',98]]};let pool=[],mode='',coins=[20,20],teams=[[],[]],round=0,starter=0,active=0,offers=[null,null],choices=[null,null],cards=[],finished=false;const $=id=>document.getElementById(id),names=['Lamine','Bassirou'];const shuffle=a=>a.sort(()=>Math.random()-.5);function start(m){mode=m;coins=[20,20];teams=[[],[]];round=0;starter=0;finished=false;pool=shuffle(Object.entries(roster).flatMap(([anime,people])=>people.map(([name,power])=>({name,power,anime}))));$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('mode').textContent=m==='three'?'🃏 Tre carte':m==='classic'?'⚔️ Asta classica':'🌌 Multiverso';next()}function reset(){$('game').classList.add('hidden');$('setup').classList.remove('hidden')}function note(s){$('log').innerHTML='<p>'+s+'</p>'+$('log').innerHTML}function next(){if(teams[0].length===4&&teams[1].length===4)return end();if(round>=30)return end();round++;offers=[null,null];choices=[null,null];starter=(round-1)%2;active=starter;let eligible=pool.filter(x=>!cards.includes(x));if(mode==='multiverse'&&round%2===0){let a=shuffle(Object.keys(roster))[0];eligible=eligible.filter(x=>x.anime===a)}cards=shuffle(eligible).slice(0,mode==='three'?3:1);if(!cards.length)return end();cards.forEach(x=>pool.splice(pool.indexOf(x),1));$('round').textContent='Round '+round;$('log').innerHTML='';if(mode!=='three'){choices[starter]=0;offers[starter]=0;active=1-starter;note(names[starter]+' apre automaticamente a 0 monete')}render()}function pick(i){if(choices[active]!==null)return;choices[active]=i;offers[active]=0;note(names[active]+' sceglie '+cards[i].name+' e offre 0');active=1-active;if(choices[active]!==null&&choices[0]!==choices[1])return resolve();render()}function bid(n){if(choices[active]===null)return;const other=1-active;let min=choices[other]===choices[active]&&offers[other]!==null?offers[other]+1:offers[active]+1;if(n<min||n>coins[active])return;offers[active]=n;note(names[active]+' offre '+n+' per '+cards[choices[active]].name);active=other;render()}function pass(){let other=1-active;if(choices[active]===null){if(choices[other]!==null){award(other);return}return}if(choices[0]!==choices[1])return resolve();award(other)}function award(w){let x=cards[choices[w]],price=offers[w]??0;if(!x||price>coins[w])return;coins[w]-=price;teams[w].push(x);note(names[w]+' conquista '+x.name+' per '+price+' monete');setTimeout(next,1100);render()}function resolve(){for(let p=0;p<2;p++){if(choices[p]!==null&&teams[p].length<4){let x=cards[choices[p]];coins[p]-=offers[p]??0;teams[p].push(x)}}note('Personaggi diversi: entrambi assegnati alle rispettive squadre');setTimeout(next,1200);render()}function render(){for(let p=0;p<2;p++){$('c'+p).textContent=coins[p];$('t'+p).innerHTML=teams[p].map(x=>'<p>✦ '+x.name+'</p>').join('')}if(finished)return;$('status').textContent='Turno di '+names[active]+(choices[active]===null?' · scegli una carta':' · rilancia o passa');$('cards').innerHTML=cards.map((x,i)=>'<div class="card '+(choices.includes(i)?'chosen':'')+'" style="animation-delay:'+(i*.12)+'s"><small>'+x.anime+'</small><b>'+x.name+'</b><small>⚡ '+x.power+'</small><br><small>'+(choices[0]===i?'Lamine ':'')+(choices[1]===i?'Bassirou':'')+'</small></div>').join('');let el=$('controls');el.innerHTML='';function btn(label,fn,disabled=false){let b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=fn;el.appendChild(b)}if(choices[active]===null){cards.forEach((x,i)=>btn('Scegli '+(i+1),()=>pick(i),teams[active].length>=4));btn('Passa',pass)}else{let other=1-active;let min=choices[other]===choices[active]&&offers[other]!==null?offers[other]+1:offers[active]+1;[min,min+1,min+2,min+5].filter((v,i,a)=>a.indexOf(v)===i).forEach(v=>btn('🪙 '+v,()=>bid(v),v>coins[active]));btn('Passa',pass)}}function end(){finished=true;let a=teams.map(t=>t.reduce((s,x)=>s+x.power,0));$('status').innerHTML='<div class="win">🏆 '+(a[0]===a[1]?'PAREGGIO':names[a[0]>a[1]?0:1].toUpperCase()+' VINCE!')+'</div>Potenza: '+a[0]+' vs '+a[1];$('cards').innerHTML='';$('controls').innerHTML='';render()} 
</script><script>
(function(){const p=document.getElementById('particles');for(let i=0;i<36;i++){const s=document.createElement('i');s.className='spark';s.style.setProperty('--left',(i*37%100)+'%');s.style.setProperty('--duration',(5+i%9)+'s');s.style.setProperty('--delay',(-i*.73)+'s');p.appendChild(s)}})();
function arenaFX(message){const t=document.getElementById('toast'),f=document.getElementById('flash');t.textContent=message;t.classList.remove('show');f.classList.remove('go');void t.offsetWidth;t.classList.add('show');f.classList.add('go')}
const originalStart=start;start=function(m){arenaFX('⚔️ INIZIA LA SFIDA');originalStart(m)};
const originalPick=pick;pick=function(i){arenaFX('🃏 CARTA SCELTA');originalPick(i)};
const originalBid=bid;bid=function(n){arenaFX('🪙 RILANCIO '+n);originalBid(n)};
const originalAward=award;award=function(w){arenaFX('✨ '+names[w].toUpperCase()+' CONQUISTA!');originalAward(w)};
const originalEnd=end;end=function(){originalEnd();arenaFX('🏆 SFIDA CONCLUSA')};
</script></body></html>
