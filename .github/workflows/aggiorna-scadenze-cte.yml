name: Aggiorna scadenze CTE

# Rilegge le CTE (PDF nelle cartelle cte*) e aggiorna data/scadenze-cte.json,
# usato dal Drive per l'etichetta "Scade il …". Parte da solo quando si caricano o tolgono CTE,
# e ogni mattina per sicurezza.
on:
  push:
    branches: [main]
    paths:
      - 'documenti/**/cte*/**'
      - 'scripts/genera-scadenze-cte.py'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scadenze-cte
  cancel-in-progress: true

jobs:
  update-cte-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (solo CTE, script e dati)
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /data/
            /documenti/**/cte*/**

      - name: Installa pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Leggi le scadenze
        run: python3 scripts/genera-scadenze-cte.py

      - name: Salva aggiornamento
        run: |
          git config user.name "TOP HOUSE Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scadenze-cte.json
          if git diff --cached --quiet; then
            echo "Scadenze già aggiornate."
            exit 0
          fi
          git commit -m "Aggiorna scadenze CTE"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --strategy-option=theirs
            python3 scripts/genera-scadenze-cte.py
            git add data/scadenze-cte.json
            git diff --cached --quiet || git commit --amend --no-edit
            sleep $((attempt * 5))
          done
          exit 1
