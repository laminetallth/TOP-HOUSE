name: Esporta contratti partner (file privato)
on:
  workflow_dispatch:
    inputs:
      partner: { description: 'promup / greenworld / bwc', type: string, default: 'promup' }
      dal: { description: 'Dal (AAAA-MM-GG)', type: string, default: '2026-10-01' }
      al: { description: 'Al (AAAA-MM-GG)', type: string, default: '2026-10-31' }
jobs:
  esporta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: automazioni }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Installa browser
        working-directory: automazioni/server
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Esporta
        working-directory: automazioni/server
        env:
          PROMUP_USER: ${{ secrets.PROMUP_USER }}
          PROMUP_PASSWORD: ${{ secrets.PROMUP_PASSWORD }}
          GREENWORLD_USER: ${{ secrets.GREENWORLD_USER }}
          GREENWORLD_PASSWORD: ${{ secrets.GREENWORLD_PASSWORD }}
          BWC_USER: ${{ secrets.BWC_USER }}
          BWC_PASSWORD: ${{ secrets.BWC_PASSWORD }}
          PARTNER: ${{ inputs.partner }}
          DAL: ${{ inputs.dal }}
          AL: ${{ inputs.al }}
        run: node esporta.mjs
      - uses: actions/upload-artifact@v4
        with: { name: esportazione, path: esiti-automazione/, retention-days: 1 }
