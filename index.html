```html
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOP HOUSE</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    color:#111;
}

/* HEADER */

header{
    background:#fff;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.logo{
    display:flex;
    align-items:center;
    gap:15px;
}

.logo img{
    width:70px;
}

.logo-text h1{
    font-size:42px;
    font-weight:900;
    background:linear-gradient(90deg,#ff0055,#ff9900);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.logo-text p{
    font-size:16px;
    font-weight:700;
}

.archive{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:700;
}

.archive-icon{
    width:50px;
    height:50px;
    border-radius:50%;
    background:linear-gradient(135deg,#ff0055,#ff9900);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:20px;
}

/* HERO */

.container{
    max-width:1300px;
    margin:auto;
    padding:35px 20px;
}

.hero{
    background:linear-gradient(135deg,#ff0055,#ff9900);
    border-radius:35px;
    padding:55px;
    color:white;
    margin-bottom:35px;
    position:relative;
    overflow:hidden;
}

.hero::after{
    content:'';
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    right:-80px;
    bottom:-80px;
}

.hero h1{
    font-size:60px;
    font-weight:900;
    margin-bottom:10px;
}

.hero p{
    font-size:18px;
    margin-bottom:25px;
}

.search-box{
    max-width:500px;
    display:flex;
    background:#fff;
    padding:6px;
    border-radius:50px;
}

.search-box input{
    flex:1;
    border:none;
    outline:none;
    padding:15px 20px;
    border-radius:50px;
    font-size:16px;
}

.search-btn{
    width:50px;
    height:50px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    color:white;
    background:linear-gradient(135deg,#ff0055,#ff9900);
}

/* CATEGORIE */

.categories{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:28px;
    padding:30px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 25px rgba(0,0,0,.05);
}

.card:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.card-icon{
    width:80px;
    height:80px;
    margin:auto;
    margin-bottom:18px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    color:white;
    background:linear-gradient(135deg,#ff0055,#ff9900);
}

.card h3{
    font-size:18px;
    font-weight:800;
}

/* FOOTER */

footer{
    text-align:center;
    padding:35px;
    color:#777;
}

footer span{
    color:#ff5500;
    font-weight:800;
}

/* MOBILE */

@media(max-width:768px){

header{
    padding:20px;
}

.logo-text h1{
    font-size:30px;
}

.logo-text p{
    display:none;
}

.hero{
    padding:35px 25px;
}

.hero h1{
    font-size:40px;
}

.archive span{
    display:none;
}

}

</style>
</head>

<body>

<header>

    <div class="logo">
        <img src="logo.png" alt="TOP HOUSE">
        <div class="logo-text">
            <h1>TOP HOUSE</h1>
            <p>casa, energia, fiducia.</p>
        </div>
    </div>

    <div class="archive">
        <div class="archive-icon">
            <i class="fa-solid fa-folder-tree"></i>
        </div>
        <span>Archivio</span>
    </div>

</header>

<div class="container">

    <div class="hero">
        <h1>I Miei File</h1>
        <p>Tutti i documenti condivisi dagli amministratori.</p>

        <div class="search-box">
            <input type="text" placeholder="Cerca cartelle...">
            <button class="search-btn">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </div>

    <div class="categories">

        <div class="card" onclick="location.href='luce-gas.html'">
            <div class="card-icon"><i class="fa-solid fa-fire"></i></div>
            <h3>LUCE E GAS</h3>
        </div>

        <div class="card" onclick="location.href='fotovoltaico.html'">
            <div class="card-icon"><i class="fa-solid fa-solar-panel"></i></div>
            <h3>FOTOVOLTAICO</h3>
        </div>

        <div class="card" onclick="location.href='climatizzatore.html'">
            <div class="card-icon"><i class="fa-solid fa-snowflake"></i></div>
            <h3>CLIMATIZZATORE</h3>
        </div>

        <div class="card" onclick="location.href='caldaia.html'">
            <div class="card-icon"><i class="fa-solid fa-fire-flame-curved"></i></div>
            <h3>CALDAIA</h3>
        </div>

        <div class="card" onclick="location.href='depuratore.html'">
            <div class="card-icon"><i class="fa-solid fa-droplet"></i></div>
            <h3>DEPURATORE</h3>
        </div>

        <div class="card" onclick="location.href='infissi.html'">
            <div class="card-icon"><i class="fa-solid fa-window-maximize"></i></div>
            <h3>INFISSI</h3>
        </div>

        <div class="card" onclick="location.href='pompe-calore.html'">
            <div class="card-icon"><i class="fa-solid fa-fan"></i></div>
            <h3>POMPE DI CALORE</h3>
        </div>

        <div class="card" onclick="location.href='allarmi.html'">
            <div class="card-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h3>ALLARMI</h3>
        </div>

        <div class="card" onclick="location.href='telefonia.html'">
            <div class="card-icon"><i class="fa-solid fa-phone"></i></div>
            <h3>TELEFONIA</h3>
        </div>

        <div class="card" onclick="location.href='wall-box.html'">
            <div class="card-icon"><i class="fa-solid fa-charging-station"></i></div>
            <h3>WALL BOX</h3>
        </div>

        <div class="card" onclick="location.href='moduli.html'">
            <div class="card-icon"><i class="fa-solid fa-file-lines"></i></div>
            <h3>MODULI</h3>
        </div>

    </div>

</div>

<footer>
    © 2026 <span>TOP HOUSE</span>
</footer>

</body>
</html>
