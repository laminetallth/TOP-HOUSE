body{

header{

.logo{
    display:flex;
    align-items:center;
    gap:18px;
}

.logo img{
    width:70px;
}

.logo-text h1{
    font-size:42px;
    background:linear-gradient(90deg,#ff0055,#ff9900);

}

}

.active{
    color:#ff5500;
}

.admin{

}
