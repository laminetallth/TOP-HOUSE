<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivio Preferiti | TOP HOUSE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="stile-top-house.css">
<style>
body{padding:0;}
.archive-page header{padding:20px 40px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:15px;}.logo img{width:70px;}.logo-text h1{font-size:42px;font-weight:900;background:linear-gradient(90deg,#ff0055,#ff9900);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}.logo-text p{font-weight:700;}.back-home{text-decoration:none;font-weight:900;color:#111;background:#fff;border-radius:999px;padding:12px 18px;box-shadow:0 10px 30px rgba(39,24,75,.08);} .back-home:hover{color:#ff6a00;}
.container{max-width:1200px;margin:auto;padding:36px 20px;}.archive-hero{background:linear-gradient(135deg,#ff0055,#ff9900);color:#fff;border-radius:36px;padding:44px;box-shadow:0 28px 80px rgba(255,87,34,.26);}.archive-hero h1{font-size:56px;font-weight:900;line-height:1;margin-bottom:10px;}.archive-hero p{font-size:18px;}
@media(max-width:768px){.archive-page header{padding:18px;align-items:flex-start;gap:14px;flex-direction:column;}.logo-text h1{font-size:30px;}.container{padding:20px 14px;}.archive-hero{padding:32px 22px;border-radius:28px;}.archive-hero h1{font-size:40px;}}
</style>
</head>
<body class="archive-page">
<header>
  <div class="logo">
    <img src="logo.png" alt="TOP HOUSE">
    <div class="logo-text"><h1>TOP HOUSE</h1><p>casa, energia, fiducia.</p></div>
  </div>
  <a class="back-home" href="index.html"><i class="fa-solid fa-arrow-left"></i> Homepage</a>
</header>
<main class="container">
  <section class="archive-hero">
    <h1>Archivio Preferiti</h1>
    <p>Ritrova rapidamente tutti i documenti salvati con la stellina.</p>
  </section>
  <section class="archive-toolbar" aria-label="Ricerca preferiti">
    <input id="archiveSearch" class="archive-search" type="search" placeholder="Cerca per nome file, gestore o sezione...">
  </section>
  <section id="archiveList" class="archive-grid" aria-live="polite"></section>
</main>
<script src="pdf-tools.js"></script>
<script>
const list = document.getElementById('archiveList');
const search = document.getElementById('archiveSearch');

function formatDate(value) {
  try { return new Intl.DateTimeFormat('it-IT', { dateStyle: 'medium', timeStyle: 'short' }).format(new Date(value)); }
  catch (error) { return 'Data non disponibile'; }
}

function renderArchive() {
  const query = search.value.trim().toLowerCase();
  const favorites = TOPHOUSE_PDF.getFavorites().filter(item => [item.name, item.manager, item.section].join(' ').toLowerCase().includes(query));
  list.innerHTML = '';
  if (favorites.length === 0) {
    list.className = '';
    list.innerHTML = '<div class="archive-empty"><i class="fa-regular fa-star"></i><br>Nessun documento salvato nei preferiti.</div>';
    return;
  }
  list.className = 'archive-grid';
  favorites.forEach(pdf => {
    const card = document.createElement('article');
    card.className = 'archive-card';
    card.innerHTML = `
      <h3><i class="fa-solid ${TOPHOUSE_PDF.getFileIcon(pdf.name)}"></i> ${pdf.name}</h3>
      <div class="archive-meta">
        <span><strong>Gestore:</strong> ${pdf.manager}</span>
        <span><strong>Sezione:</strong> ${pdf.section}</span>
        <span><strong>Data aggiunta:</strong> ${formatDate(pdf.savedAt)}</span>
      </div>
      <div class="archive-actions">
        <button type="button" class="primary preview"><i class="fa-solid fa-eye"></i> Anteprima</button>
        <a href="${TOPHOUSE_PDF.normalizePdf(pdf).downloadUrl}" target="_blank" rel="noopener"><i class="fa-solid fa-download"></i> Apri / Scarica</a>
        <button type="button" class="remove"><i class="fa-solid fa-star"></i> Rimuovi</button>
      </div>`;
    card.querySelector('.preview').addEventListener('click', () => TOPHOUSE_PDF.openPreview(pdf));
    card.querySelector('.remove').addEventListener('click', () => { TOPHOUSE_PDF.removeFavorite(pdf); renderArchive(); });
    list.appendChild(card);
  });
}
search.addEventListener('input', renderArchive);
renderArchive();
</script>
</body>
</html>
